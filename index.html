<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Birthdays</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Birthdays">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#C4622D">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#FAF8F4; --surface:#FFFFFF; --text:#1C1814; --muted:#8B7355;
      --accent:#C4622D; --accent-light:#F5E6DC; --border:#EDE8DF;
      --shadow:0 2px 16px rgba(44,32,20,0.08); --radius:16px;
      --font-display:'Cormorant Garamond',serif; --font-body:'Outfit',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;max-width:430px;margin:0 auto;overflow-x:hidden}
    #app{min-height:100vh;padding-bottom:84px}

    /* HEADER */
    .header{padding:56px 24px 20px;display:flex;align-items:flex-end;justify-content:space-between}
    .header-eyebrow{font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px}
    .header-title{font-family:var(--font-display);font-size:44px;font-weight:400;font-style:italic;line-height:1}
    .header-right{display:flex;align-items:flex-end;gap:10px;padding-bottom:6px}
    .header-count{font-size:13px;color:var(--muted)}
    .avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;cursor:pointer;border:1.5px solid var(--border)}

    /* BIRTHDAY LIST */
    .birthday-list{padding:4px 16px 0;display:flex;flex-direction:column;gap:10px}
    .birthday-card{background:var(--surface);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);border:1.5px solid transparent;cursor:pointer;transition:transform .13s}
    .birthday-card:active{transform:scale(.975)}
    .birthday-card.soon{border-color:rgba(196,98,45,.3);background:linear-gradient(135deg,#FFFCFA,#FFF6EF)}
    .birthday-card.today{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-light),#FDEEE4)}
    .card-name{font-family:var(--font-display);font-size:25px;font-weight:500;line-height:1.1;margin-bottom:3px}
    .card-date{font-size:13px;color:var(--muted)}
    .card-tz{font-size:11px;color:var(--muted);opacity:.65;margin-top:2px}
    .card-right{text-align:right;flex-shrink:0;margin-left:16px}
    .days-num{font-size:30px;font-weight:600;line-height:1}
    .days-lbl{font-size:10px;color:var(--muted);margin-top:2px}
    .today-pill{background:var(--accent);color:white;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px}

    /* IMPORT BANNER */
    .import-banner{margin:12px 16px 0;background:linear-gradient(135deg,#EEF4FF,#E8F0FF);border:1.5px solid rgba(66,133,244,.25);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
    .import-banner:active{opacity:.8}
    .import-icon{font-size:22px;flex-shrink:0}
    .import-text{flex:1}
    .import-title{font-size:14px;font-weight:600;color:#1a56db;margin-bottom:2px}
    .import-sub{font-size:12px;color:#4b7be5}
    .import-arrow{font-size:16px;color:#4b7be5}

    /* EMPTY */
    .empty-state{text-align:center;padding:80px 32px}
    .empty-icon{font-size:52px;display:block;margin-bottom:16px}
    .empty-title{font-family:var(--font-display);font-size:30px;font-style:italic;margin-bottom:8px}
    .empty-sub{font-size:14px;color:var(--muted);line-height:1.7}

    /* BOTTOM NAV */
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(250,248,244,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 0 28px;z-index:100}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;cursor:pointer;background:none;border:none}
    .nav-btn:active{opacity:.5}
    .nav-icon{font-size:22px;transition:transform .2s;line-height:1}
    .nav-btn.active .nav-icon{transform:scale(1.2)}
    .nav-label{font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
    .nav-btn.active .nav-label{color:var(--accent)}

    /* SCREENS */
    .screen{padding:56px 24px 24px}
    .screen-title{font-family:var(--font-display);font-size:36px;font-style:italic;margin-bottom:4px}
    .screen-sub{font-size:13px;color:var(--muted);margin-bottom:28px}

    /* LOGIN */
    .login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 32px;text-align:center}
    .login-title{font-family:var(--font-display);font-size:52px;font-style:italic;font-weight:400;line-height:1;margin-bottom:8px}
    .login-sub{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:48px}
    .google-btn{display:inline-flex;align-items:center;gap:12px;background:white;border:1.5px solid var(--border);border-radius:14px;padding:15px 28px;font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);transition:transform .13s}
    .google-btn:active{transform:scale(.97)}
    .google-logo{width:20px;height:20px}

    /* NLP BOX */
    .nlp-box{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:24px}
    .nlp-label{font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
    .nlp-input{width:100%;border:none;background:transparent;font-family:var(--font-body);font-size:15px;color:var(--text);resize:none;outline:none;line-height:1.65;min-height:72px}
    .nlp-input::placeholder{color:var(--muted);opacity:.55}
    .nlp-btn{margin-top:12px;width:100%;background:var(--accent);color:white;border:none;border-radius:12px;padding:13px;font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
    .nlp-btn:active{opacity:.8}
    .nlp-btn:disabled{opacity:.45;cursor:default}
    .parsed-ok{background:var(--accent-light);border:1px solid rgba(196,98,45,.25);border-radius:12px;padding:13px 16px;margin-top:12px;font-size:13px;line-height:1.6}
    .parsed-ok strong{color:var(--accent)}
    .parsed-err{background:#FFF0F0;border:1px solid rgba(192,57,43,.2);border-radius:12px;padding:13px 16px;margin-top:12px;font-size:13px;color:#C0392B;line-height:1.6}

    /* DIVIDER */
    .divider{display:flex;align-items:center;gap:12px;margin-bottom:24px}
    .divider-line{flex:1;height:1px;background:var(--border)}
    .divider-text{font-size:12px;color:var(--muted);white-space:nowrap}

    /* FORM */
    .form-group{margin-bottom:18px}
    .form-label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
    .form-input,.form-select{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;font-family:var(--font-body);font-size:15px;color:var(--text);outline:none;transition:border-color .15s;appearance:none;-webkit-appearance:none}
    .form-input:focus,.form-select:focus{border-color:var(--accent)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .sel-wrap{position:relative}
    .sel-wrap::after{content:'↓';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}

    /* TZ SEARCH */
    .tz-wrap{position:relative}
    .tz-search-input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px 12px 0 0;padding:13px 42px 13px 16px;font-family:var(--font-body);font-size:15px;color:var(--text);outline:none;transition:border-color .15s;border-bottom:1px solid var(--border)}
    .tz-search-input:focus{border-color:var(--accent)}
    .tz-search-icon{position:absolute;right:14px;top:14px;font-size:16px;pointer-events:none;opacity:.4}
    .tz-list{background:var(--surface);border:1.5px solid var(--border);border-top:none;border-radius:0 0 12px 12px;max-height:192px;overflow-y:auto;overscroll-behavior:contain}
    .tz-item{padding:11px 16px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
    .tz-item:last-child{border-bottom:none}
    .tz-item:hover{background:var(--bg)}
    .tz-item.selected{background:var(--accent-light);color:var(--accent);font-weight:600}
    .tz-empty{padding:14px 16px;font-size:13px;color:var(--muted);font-style:italic}
    .tz-badge{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--accent-light);border:1.5px solid rgba(196,98,45,.3);border-radius:10px;padding:9px 14px;font-size:13px;color:var(--accent);font-weight:600}

    /* LEAD PILLS */
    .lead-pills{display:flex;flex-wrap:wrap;gap:8px}
    .lead-pill{padding:9px 16px;border-radius:24px;font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);transition:all .15s;user-select:none}
    .lead-pill:active{transform:scale(.93)}
    .lead-pill.active{background:var(--accent);border-color:var(--accent);color:white;font-weight:600}
    .lead-hint{font-size:11px;color:var(--muted);margin-top:8px}

    /* SUBMIT */
    .submit-btn{width:100%;background:var(--text);color:var(--bg);border:none;border-radius:12px;padding:16px;font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;margin-top:8px}
    .submit-btn:active{opacity:.75}
    .submit-btn:disabled{opacity:.4;cursor:default}

    /* DETAIL */
    .back-btn{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:var(--accent);font-weight:500;cursor:pointer;background:none;border:none;padding:0;margin-bottom:28px}
    .detail-name{font-family:var(--font-display);font-size:48px;font-style:italic;font-weight:400;line-height:1;margin-bottom:6px}
    .detail-date{font-size:14px;color:var(--muted);margin-bottom:28px}
    .countdown-box{background:var(--accent-light);border-radius:var(--radius);padding:28px;text-align:center;margin-bottom:16px}
    .countdown-num{font-size:68px;font-weight:600;line-height:1;color:var(--accent)}
    .countdown-lbl{font-size:14px;color:var(--muted);margin-top:4px}
    .info-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
    .info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 20px;border-bottom:1px solid var(--border)}
    .info-row:last-child{border-bottom:none}
    .info-key{font-size:13px;color:var(--muted);flex-shrink:0;margin-right:12px;padding-top:2px}
    .info-val{font-size:14px;font-weight:500;text-align:right}
    .reminder-tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
    .reminder-tag{background:var(--accent-light);color:var(--accent);font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
    .notify-box{background:var(--surface);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:12px;margin-bottom:24px}
    .notify-icon{font-size:18px;padding-top:1px}
    .notify-text{font-size:13px;color:var(--muted);line-height:1.6}
    .notify-text strong{color:var(--text);font-weight:600}
    .actions{display:flex;gap:12px}
    .action-btn{flex:1;padding:14px;border-radius:12px;font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s}
    .action-btn:active{opacity:.75}
    .action-btn.edit{background:var(--text);color:var(--bg)}
    .action-btn.delete{background:#FFE8E8;color:#C0392B}

    /* IMPORT SCREEN */
    .contact-item{background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);border:1.5px solid transparent;cursor:pointer;transition:all .13s;margin-bottom:8px}
    .contact-item:active{transform:scale(.975)}
    .contact-item.selected{border-color:var(--accent);background:var(--accent-light)}
    .contact-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;transition:all .15s}
    .contact-item.selected .contact-check{background:var(--accent);border-color:var(--accent);color:white}
    .contact-name{font-family:var(--font-display);font-size:20px;font-weight:500;line-height:1.1}
    .contact-bday{font-size:13px;color:var(--muted);margin-top:2px}
    .import-actions{position:sticky;bottom:84px;background:var(--bg);padding:12px 0 4px;display:flex;gap:10px}

    /* SETTINGS */
    .settings-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}
    .settings-note a{color:var(--accent);text-decoration:none}
    .section-header{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:28px 0 14px}
    .user-card{background:var(--surface);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;margin-bottom:24px}
    .user-photo{width:44px;height:44px;border-radius:50%;object-fit:cover}
    .user-name{font-size:15px;font-weight:600}
    .user-email{font-size:12px;color:var(--muted);margin-top:2px}
    .signout-btn{margin-left:auto;background:none;border:1.5px solid var(--border);border-radius:10px;padding:7px 14px;font-family:var(--font-body);font-size:13px;color:var(--muted);cursor:pointer}
    .signout-btn:active{opacity:.7}

    /* TOAST */
    #toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:24px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:300;max-width:90%}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* LOADER */
    .pulse-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:10px 0}
    .dots span{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;animation:blink 1s infinite}
    .dots span:nth-child(2){animation-delay:.2s}
    .dots span:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
    .full-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:var(--muted);font-size:14px}
    .spin{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .fade-in{animation:fadeIn .3s ease both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .list-section-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:0 16px;margin:20px 0 10px}
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
// ── FIREBASE ──────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyBqp-1l3u-jdvvBxlWtuE-1MxHduyKzros",
  authDomain:        "cricket-team-portal.firebaseapp.com",
  projectId:         "cricket-team-portal",
  storageBucket:     "cricket-team-portal.firebasestorage.app",
  messagingSenderId: "137160162012",
  appId:             "1:137160162012:web:ebe4a3b7fe8f8b80ae5219",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

const googleProvider = new firebase.auth.GoogleAuthProvider();
googleProvider.addScope('https://www.googleapis.com/auth/contacts.readonly');

// ── CONSTANTS ─────────────────────────────
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

const TIMEZONES = [
  {label:'India (IST, UTC+5:30)',     value:'Asia/Kolkata'},
  {label:'New York (ET)',             value:'America/New_York'},
  {label:'Chicago (CT)',              value:'America/Chicago'},
  {label:'Denver (MT)',               value:'America/Denver'},
  {label:'Los Angeles (PT)',          value:'America/Los_Angeles'},
  {label:'Honolulu (HST)',            value:'Pacific/Honolulu'},
  {label:'London (GMT/BST)',          value:'Europe/London'},
  {label:'Paris / Berlin (CET)',      value:'Europe/Paris'},
  {label:'Moscow (MSK)',              value:'Europe/Moscow'},
  {label:'Dubai (GST, UTC+4)',        value:'Asia/Dubai'},
  {label:'Pakistan (PKT, UTC+5)',     value:'Asia/Karachi'},
  {label:'Nepal (NPT, UTC+5:45)',     value:'Asia/Kathmandu'},
  {label:'Bangladesh (BST, UTC+6)',   value:'Asia/Dhaka'},
  {label:'Sri Lanka (SLST)',          value:'Asia/Colombo'},
  {label:'Singapore / KL (SGT)',      value:'Asia/Singapore'},
  {label:'Tokyo (JST, UTC+9)',        value:'Asia/Tokyo'},
  {label:'Shanghai / Beijing (CST)', value:'Asia/Shanghai'},
  {label:'Sydney (AEST)',             value:'Australia/Sydney'},
  {label:'Auckland (NZST)',           value:'Pacific/Auckland'},
];

const LEAD_TIMES = [
  {label:'On the day',   value:'on_day', days:0},
  {label:'1 day before', value:'1_day',  days:1},
  {label:'2 days before',value:'2_days', days:2},
  {label:'1 week before',value:'1_week', days:7},
];

// ── STATE ─────────────────────────────────
const S = {
  view:'loading', birthdays:[], selectedId:null, editingId:null,
  user:null, accessToken:null,
  userTimezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
  fTz:'', fTzQ:'', fLeads:['on_day'],
  sTz:'', sTzQ:'',
  importContacts:[], importSelected:new Set(),
};

// ── FIRESTORE ─────────────────────────────
function col() {
  return db.collection('users').doc(S.user.uid).collection('birthdays');
}

async function loadBirthdays() {
  try {
    const snap = await col().orderBy('createdAt','asc').get();
    S.birthdays = snap.docs.map(d => ({id:d.id, ...d.data()}));
  } catch(e) {
    // If no index or first load, just get without order
    try {
      const snap = await col().get();
      S.birthdays = snap.docs.map(d => ({id:d.id, ...d.data()}));
    } catch(e2) { S.birthdays = []; }
  }
}

async function saveToFirestore(data, id=null) {
  if (!S.user) return null;
  if (id) { await col().doc(id).set(data, {merge:true}); return id; }
  const ref = await col().add({...data, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
  return ref.id;
}

async function deleteFromFirestore(id) {
  if (!S.user) return;
  await col().doc(id).delete();
}

// ── AUTH ──────────────────────────────────
async function signIn() {
  try {
    const result = await auth.signInWithPopup(googleProvider);
    S.accessToken = result.credential?.accessToken;
  } catch(e) {
    toast('Sign in failed: ' + (e.message||'unknown error'));
  }
}

async function signOut() {
  await auth.signOut();
  S.birthdays = []; S.user = null; S.accessToken = null;
  go('loading');
}

// ── UTILS ─────────────────────────────────
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2);

function daysUntil(month, day, tz) {
  const fmt = new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'numeric',day:'numeric'});
  const p   = fmt.formatToParts(new Date());
  const g   = t => parseInt(p.find(x=>x.type===t).value);
  const [tY,tM,tD] = [g('year'),g('month'),g('day')];
  let bY = tY;
  if (tM > month || (tM===month && tD > day)) bY++;
  return Math.round((Date.UTC(bY,month-1,day)-Date.UTC(tY,tM-1,tD))/86400000);
}

const fmtDate   = (m,d) => `${MONTHS[m-1]} ${d}`;
const tzLabel   = v => TIMEZONES.find(t=>t.value===v)?.label||v||'';
const leadLabel = v => LEAD_TIMES.find(l=>l.value===v)?.label||v;

function notifyDesc(b) {
  const leads = Array.isArray(b.leadTimes)?b.leadTimes:[b.leadTime||'on_day'];
  const parts = leads.map(v=>{const l=LEAD_TIMES.find(x=>x.value===v);return l?.days===0?'on their birthday':`${l?.days} day${l?.days>1?'s':''} before`;});
  return `Notification at <strong>${b.notifTime||'08:00'} your time</strong> — ${parts.join(', ')} (${tzLabel(b.timezone)}).`;
}

// ── NLP PARSER (client-side) ──────────────
async function parseNLP(text){
  const t=text.toLowerCase();
  let name=null;
  const wishMatch=text.match(/(?:wish|for|birthday of|birthday for)\s+([A-Z][a-z]+)/i);
  if(wishMatch) name=wishMatch[1];
  if(!name){const cap=text.match(/\b([A-Z][a-z]{1,})\b/);if(cap) name=cap[1];}

  const monthNames=['january','february','march','april','may','june','july','august','september','october','november','december'];
  const monthShort=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  let month=null;
  for(let i=0;i<12;i++){if(t.includes(monthNames[i])||t.includes(monthShort[i])){month=i+1;break;}}
  if(!month){const m=t.match(/\b(1[0-2]|0?[1-9])[\/\-](3[01]|[12]\d|0?[1-9])\b/);if(m) month=parseInt(m[1]);}

  let day=null;
  const ordinal=text.match(/\b(\d{1,2})(?:st|nd|rd|th)\b/i);
  if(ordinal) day=parseInt(ordinal[1]);
  if(!day){const a=text.match(/(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s+(\d{1,2})/i);if(a) day=parseInt(a[1]);}
  if(!day){const b=text.match(/(\d{1,2})\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i);if(b) day=parseInt(b[1]);}
  if(!day){const m=t.match(/\b(1[0-2]|0?[1-9])[\/\-](3[01]|[12]\d|0?[1-9])\b/);if(m) day=parseInt(m[2]);}

  const tzMap=[
    {keys:['india','indian','ist','kolkata','mumbai','delhi'],tz:'Asia/Kolkata'},
    {keys:['new york','eastern','est','edt',' et '],tz:'America/New_York'},
    {keys:['chicago','central','cst','cdt'],tz:'America/Chicago'},
    {keys:['denver','mountain','mst','mdt'],tz:'America/Denver'},
    {keys:['los angeles','california','pacific','pst','pdt','west coast'],tz:'America/Los_Angeles'},
    {keys:['london','uk','england','gmt','bst'],tz:'Europe/London'},
    {keys:['paris','berlin','germany','france','cet','europe'],tz:'Europe/Paris'},
    {keys:['dubai','uae','gulf','gst'],tz:'Asia/Dubai'},
    {keys:['pakistan','karachi','pkt'],tz:'Asia/Karachi'},
    {keys:['nepal','kathmandu','npt'],tz:'Asia/Kathmandu'},
    {keys:['bangladesh','dhaka'],tz:'Asia/Dhaka'},
    {keys:['sri lanka','colombo'],tz:'Asia/Colombo'},
    {keys:['singapore','malaysia','sgt'],tz:'Asia/Singapore'},
    {keys:['tokyo','japan','jst'],tz:'Asia/Tokyo'},
    {keys:['china','beijing','shanghai'],tz:'Asia/Shanghai'},
    {keys:['sydney','australia','aest'],tz:'Australia/Sydney'},
    {keys:['auckland','new zealand','nzst'],tz:'Pacific/Auckland'},
  ];
  let timezone=null;
  for(const{keys,tz}of tzMap){if(keys.some(k=>t.includes(k))){timezone=tz;break;}}

  const leadTimes=[];
  if(/\b(on the day|same day|day itself)\b/.test(t)) leadTimes.push('on_day');
  if(/\b(1|one)\s+day\s+before\b/.test(t)||/\bday before\b/.test(t)) leadTimes.push('1_day');
  if(/\b(2|two)\s+days?\s+before\b/.test(t)) leadTimes.push('2_days');
  if(/\b(1|one)?\s*week\s+before\b/.test(t)) leadTimes.push('1_week');
  if(leadTimes.length===0) leadTimes.push('on_day');

  if(day&&(day<1||day>31)) day=null;
  return {name,month,day,timezone,leadTimes};
}

// ── GOOGLE CONTACTS ───────────────────────
async function importFromContacts(){
  try {
    // Get fresh token
    const result = await auth.signInWithPopup(googleProvider);
    const token  = result.credential?.accessToken;
    if(!token){ toast('Could not get contacts access'); return; }
    S.accessToken = token;

    toast('Loading your contacts…');
    const res = await fetch(
      'https://people.googleapis.com/v1/people/me/connections?personFields=names,birthdays&pageSize=1000&sortOrder=FIRST_NAME_ASCENDING',
      {headers:{Authorization:`Bearer ${token}`}}
    );
    if(!res.ok) throw new Error('Could not fetch contacts');
    const data = await res.json();

    const contacts = (data.connections||[])
      .filter(p=>p.birthdays?.length&&p.names?.length)
      .map(p=>({
        name:  p.names[0].displayName,
        month: p.birthdays[0].date?.month,
        day:   p.birthdays[0].date?.day,
      }))
      .filter(c=>c.month&&c.day)
      // exclude already saved
      .filter(c=>!S.birthdays.find(b=>b.name.toLowerCase()===c.name.toLowerCase()));

    if(!contacts.length){
      toast('No new contacts with birthdays found');
      return;
    }

    S.importContacts  = contacts;
    S.importSelected  = new Set();
    go('import');
  } catch(e) {
    toast('Error: '+e.message);
  }
}

function toggleImportContact(i){
  if(S.importSelected.has(i)) S.importSelected.delete(i);
  else S.importSelected.add(i);
  const el=document.getElementById(`ci-${i}`);
  if(el) el.classList.toggle('selected', S.importSelected.has(i));
  const check=el?.querySelector('.contact-check');
  if(check) check.textContent=S.importSelected.has(i)?'✓':'';
  document.getElementById('import-count').textContent=
    S.importSelected.size?`Import ${S.importSelected.size} birthday${S.importSelected.size>1?'s':''}`:'Select birthdays to import';
  document.getElementById('import-do-btn').disabled=!S.importSelected.size;
}

function selectAllContacts(){
  S.importContacts.forEach((_,i)=>S.importSelected.add(i));
  document.querySelectorAll('.contact-item').forEach(el=>el.classList.add('selected'));
  document.querySelectorAll('.contact-check').forEach(el=>el.textContent='✓');
  document.getElementById('import-count').textContent=`Import ${S.importSelected.size} birthdays`;
  document.getElementById('import-do-btn').disabled=false;
}

async function doImport(){
  if(!S.importSelected.size) return;
  const btn=document.getElementById('import-do-btn');
  btn.disabled=true; btn.textContent='Saving…';

  for(const i of S.importSelected){
    const c=S.importContacts[i];
    const data={name:c.name,month:c.month,day:c.day,timezone:'Asia/Kolkata',leadTimes:['on_day'],notifTime:'08:00'};
    const id=await saveToFirestore(data);
    S.birthdays.push({id,...data});
  }

  toast(`🎂 ${S.importSelected.size} birthday${S.importSelected.size>1?'s':''} imported!`);
  go('home');
}

  </div>`;
}

// ── RENDER — SETTINGS ─────────────────────
function renderSettings(){
  const u=S.user;
  return `<div class="screen fade-in">
    <div class="screen-title">Settings</div>
    <div class="screen-sub">Your preferences</div>

    ${u?`<div class="user-card">
      ${u.photoURL?`<img class="user-photo" src="${u.photoURL}">`:'<div style="width:44px;height:44px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:20px">👤</div>'}
      <div><div class="user-name">${u.displayName||'You'}</div><div class="user-email">${u.email||''}</div></div>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>`:''}

    <div class="form-group">
      <label class="form-label">Your Timezone</label>
      ${tzSearchHtml({id:'s-tz',query:S.sTzQ,selected:S.sTz,onInput:'sTzInput',onSelect:'sTzPick'})}
    </div>

    <button class="submit-btn" onclick="handleSaveSettings()">Save Settings</button>

    <div style="text-align:center;margin-top:48px">
      <div style="font-size:13px;color:var(--muted);font-family:var(--font-display);font-style:italic">Birthdays</div>
      <div style="font-size:11px;color:var(--muted);opacity:.4;margin-top:4px">v3.0 · Personal</div>
    </div>
  </div>`;
}

// ── MAIN RENDER ───────────────────────────
function render(){
  const views={loading:renderLoading,login:renderLogin,home:renderHome,add:renderAdd,detail:renderDetail,import:renderImport,settings:renderSettings};
  const nav=(S.view==='loading'||S.view==='login')?'':renderNav();
  document.getElementById('app').innerHTML=(views[S.view]||renderHome)()+nav;
  const nlp=document.getElementById('nlp');
  if(nlp) nlp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleParse();}});
}

// ── HANDLERS ──────────────────────────────
async function handleParse(){
  const text=document.getElementById('nlp')?.value?.trim();
  if(!text){toast('Please type something first');return;}
  const btn=document.getElementById('nlp-btn'),out=document.getElementById('nlp-result');
  btn.disabled=true; btn.textContent='Reading…';
  out.innerHTML=`<div class="pulse-row"><div class="dots"><span></span><span></span><span></span></div> Parsing…</div>`;
  try{
    const parsed=await parseNLP(text);
    if(!parsed?.name||!parsed?.month||!parsed?.day){
      out.innerHTML=`<div class="parsed-err">Couldn't parse. Try: <em>"Dec 2nd to wish Pooja, India timezone, 1 day before"</em></div>`;
    } else {
      const leads=Array.isArray(parsed.leadTimes)?parsed.leadTimes:['on_day'];
      out.innerHTML=`<div class="parsed-ok"><strong>Got it!</strong> ${parsed.name} · ${fmtDate(parsed.month,parsed.day)} · ${tzLabel(parsed.timezone)||'—'} · ${leads.map(leadLabel).join(' + ')}</div>`;
      const set=(id,v)=>{const el=document.getElementById(id);if(el&&v!=null)el.value=v;};
      set('f-name',parsed.name); set('f-month',parsed.month); set('f-day',parsed.day);
      if(parsed.timezone){S.fTz=parsed.timezone;S.fTzQ=tzLabel(parsed.timezone);fTzPick(parsed.timezone,tzLabel(parsed.timezone));}
      S.fLeads=leads;
      const lg=document.querySelector('.lead-group');if(lg) lg.innerHTML=leadPillsHtml();
    }
  } catch(e){out.innerHTML=`<div class="parsed-err">Error: ${e.message}</div>`;}
  btn.disabled=false; btn.textContent='Parse with AI →';
}

async function handleSave(){
  const name=document.getElementById('f-name')?.value?.trim();
  const month=parseInt(document.getElementById('f-month')?.value);
  const day=parseInt(document.getElementById('f-day')?.value);
  const timezone=S.fTz, leadTimes=[...S.fLeads];
  const notifTime=document.getElementById('f-time')?.value||'08:00';

  if(!name){toast('Please enter a name');return;}
  if(!timezone){toast('Search and select their timezone');return;}

  const btn=document.getElementById('save-btn');
  btn.disabled=true; btn.textContent='Saving…';

  const data={name,month,day,timezone,leadTimes,notifTime};
  const id=S.editingId;
  try{
    if(id){
      await saveToFirestore(data,id);
      S.birthdays=S.birthdays.map(b=>b.id===id?{...b,...data}:b);
      toast(`Updated ${name} ✓`);
    } else {
      const newId=await saveToFirestore(data);
      S.birthdays.push({id:newId,...data});
      toast(`${name} added! 🎂`);
    }
    go('home',{editingId:null});
  } catch(e){
    toast('Save failed: '+e.message);
    btn.disabled=false; btn.textContent=id?'Update Birthday':'Save Birthday';
  }
}

async function handleDelete(id){
  const b=S.birthdays.find(x=>x.id===id);
  if(!b||!confirm(`Delete ${b.name}'s birthday?`)) return;
  try{
    await deleteFromFirestore(id);
    S.birthdays=S.birthdays.filter(x=>x.id!==id);
    toast('Deleted'); go('home');
  } catch(e){ toast('Delete failed: '+e.message); }
}

function handleSaveSettings(){
  const tz=S.sTz;
  if(!tz){toast('Please select your timezone');return;}
  S.userTimezone=tz;
  try{localStorage.setItem('bday_settings',JSON.stringify({userTimezone:tz}));}catch(e){}
  toast('Settings saved ✓');
}

// ── INIT ──────────────────────────────────
try{const s=JSON.parse(localStorage.getItem('bday_settings')||'{}');if(s.userTimezone) S.userTimezone=s.userTimezone;}catch(e){}

// ── ONESIGNAL NOTIFICATIONS ──────────────────
const OS_APP_ID = '7f4d2625-c0f9-4228-b8ab-2019d40799e9';

function initOneSignal() {
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId:                        OS_APP_ID,
      serviceWorkerPath:            '/sw.js',
      serviceWorkerParam:           { scope: '/' },
      allowLocalhostAsSecureOrigin: true,
      notifyButton:                 { enable: false },
      welcomeNotification:          { disable: true },
    });
    console.log('OneSignal ready ✓');
  });
}

async function enableNotifications() {
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async function(OneSignal) {
    try {
      await OneSignal.Notifications.requestPermission();
      if (OneSignal.Notifications.permission) {
        toast('🔔 Notifications enabled!');
        await tagUserBirthdays();
        render();
      } else {
        toast('Notifications blocked — check iPhone Settings → Birthdays');
      }
    } catch(e) { toast('Error: ' + e.message); }
  });
}

async function tagUserBirthdays() {
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async function(OneSignal) {
    const tags = { bday_count: S.birthdays.length, user_timezone: S.userTimezone };
    S.birthdays.forEach((b, i) => {
      tags[`bday_${i}_name`]  = b.name;
      tags[`bday_${i}_month`] = String(b.month);
      tags[`bday_${i}_day`]   = String(b.day);
      tags[`bday_${i}_tz`]    = b.timezone;
      tags[`bday_${i}_leads`] = (b.leadTimes||['on_day']).join(',');
      tags[`bday_${i}_time`]  = b.notifTime||'08:00';
    });
    await OneSignal.User.addTags(tags);
    console.log('Birthday tags saved ✓');
  });
}

function requestNotificationPermission() {
  return ('Notification' in window) && Notification.permission === 'granted';
}

initOneSignal();
render();

auth.onAuthStateChanged(async user=>{
  S.user=user;
  if(user){
    await loadBirthdays();
    go('home');
    setTimeout(()=>tagUserBirthdays(), 2000);
  } else {
    go('login');
  }
});
</script>
