<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Birthdays</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #FAF8F4;
      --surface:      #FFFFFF;
      --text:         #1C1814;
      --muted:        #8B7355;
      --accent:       #C4622D;
      --accent-light: #F5E6DC;
      --border:       #EDE8DF;
      --shadow:       0 2px 16px rgba(44, 32, 20, 0.08);
      --radius:       16px;
      --font-display: 'Cormorant Garamond', serif;
      --font-body:    'Outfit', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      overflow-x: hidden;
    }

    #app { min-height: 100vh; padding-bottom: 84px; }

    /* ── HEADER ── */
    .header { padding: 56px 24px 20px; display: flex; align-items: flex-end; justify-content: space-between; }
    .header-eyebrow { font-size: 12px; color: var(--muted); letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 4px; }
    .header-title   { font-family: var(--font-display); font-size: 44px; font-weight: 400; font-style: italic; line-height: 1; }
    .header-count   { font-size: 13px; color: var(--muted); padding-bottom: 6px; }

    /* ── BIRTHDAY LIST ── */
    .birthday-list { padding: 4px 16px 0; display: flex; flex-direction: column; gap: 10px; }
    .birthday-card {
      background: var(--surface); border-radius: var(--radius); padding: 18px 20px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: var(--shadow); border: 1.5px solid transparent;
      cursor: pointer; transition: transform 0.13s ease;
    }
    .birthday-card:active { transform: scale(0.975); }
    .birthday-card.soon  { border-color: rgba(196,98,45,0.3); background: linear-gradient(135deg,#FFFCFA,#FFF6EF); }
    .birthday-card.today { border-color: var(--accent); background: linear-gradient(135deg, var(--accent-light), #FDEEE4); }
    .card-name  { font-family: var(--font-display); font-size: 25px; font-weight: 500; line-height: 1.1; margin-bottom: 3px; }
    .card-date  { font-size: 13px; color: var(--muted); }
    .card-tz    { font-size: 11px; color: var(--muted); opacity: 0.65; margin-top: 2px; }
    .card-right { text-align: right; flex-shrink: 0; margin-left: 16px; }
    .days-num   { font-size: 30px; font-weight: 600; line-height: 1; }
    .days-lbl   { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .today-pill { background: var(--accent); color: white; font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 20px; }

    /* ── EMPTY ── */
    .empty-state { text-align: center; padding: 80px 32px; }
    .empty-icon  { font-size: 52px; display: block; margin-bottom: 16px; }
    .empty-title { font-family: var(--font-display); font-size: 30px; font-style: italic; margin-bottom: 8px; }
    .empty-sub   { font-size: 14px; color: var(--muted); line-height: 1.7; }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      background: rgba(250,248,244,0.93); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border); display: flex; padding: 8px 0 28px; z-index: 100;
    }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; cursor: pointer; background: none; border: none; }
    .nav-btn:active { opacity: 0.5; }
    .nav-icon  { font-size: 22px; transition: transform 0.2s; line-height: 1; }
    .nav-btn.active .nav-icon  { transform: scale(1.2); }
    .nav-label { font-size: 10px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .nav-btn.active .nav-label { color: var(--accent); }

    /* ── SCREENS ── */
    .screen       { padding: 56px 24px 24px; }
    .screen-title { font-family: var(--font-display); font-size: 36px; font-style: italic; margin-bottom: 4px; }
    .screen-sub   { font-size: 13px; color: var(--muted); margin-bottom: 28px; }

    /* ── NLP BOX ── */
    .nlp-box   { background: var(--surface); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 24px; }
    .nlp-label { font-size: 10px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .nlp-input { width: 100%; border: none; background: transparent; font-family: var(--font-body); font-size: 15px; color: var(--text); resize: none; outline: none; line-height: 1.65; min-height: 72px; }
    .nlp-input::placeholder { color: var(--muted); opacity: 0.55; }
    .nlp-btn { margin-top: 12px; width: 100%; background: var(--accent); color: white; border: none; border-radius: 12px; padding: 13px; font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
    .nlp-btn:active { opacity: 0.8; }
    .nlp-btn:disabled { opacity: 0.45; cursor: default; }
    .parsed-ok  { background: var(--accent-light); border: 1px solid rgba(196,98,45,0.25); border-radius: 12px; padding: 13px 16px; margin-top: 12px; font-size: 13px; line-height: 1.6; }
    .parsed-ok strong { color: var(--accent); }
    .parsed-err { background: #FFF0F0; border: 1px solid rgba(192,57,43,0.2); border-radius: 12px; padding: 13px 16px; margin-top: 12px; font-size: 13px; color: #C0392B; line-height: 1.6; }

    /* ── DIVIDER ── */
    .divider      { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-size: 12px; color: var(--muted); white-space: nowrap; }

    /* ── FORM ── */
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .form-input, .form-select {
      width: 100%; background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 14px 16px; font-family: var(--font-body);
      font-size: 15px; color: var(--text); outline: none; transition: border-color 0.15s;
      appearance: none; -webkit-appearance: none;
    }
    .form-input:focus, .form-select:focus { border-color: var(--accent); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sel-wrap { position: relative; }
    .sel-wrap::after { content: '↓'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); pointer-events: none; }

    /* ── TIMEZONE SEARCH ── */
    .tz-wrap { position: relative; }
    .tz-search-input {
      width: 100%; background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 12px 12px 0 0; padding: 13px 42px 13px 16px;
      font-family: var(--font-body); font-size: 15px; color: var(--text);
      outline: none; transition: border-color 0.15s; border-bottom: 1px solid var(--border);
    }
    .tz-search-input:focus { border-color: var(--accent); }
    .tz-search-icon { position: absolute; right: 14px; top: 14px; font-size: 16px; pointer-events: none; opacity: 0.4; }
    .tz-list {
      background: var(--surface); border: 1.5px solid var(--border); border-top: none;
      border-radius: 0 0 12px 12px; max-height: 192px; overflow-y: auto;
      overscroll-behavior: contain;
    }
    .tz-item {
      padding: 11px 16px; font-size: 14px; cursor: pointer;
      border-bottom: 1px solid var(--border); transition: background 0.1s;
    }
    .tz-item:last-child { border-bottom: none; }
    .tz-item:hover { background: var(--bg); }
    .tz-item.selected { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .tz-empty { padding: 14px 16px; font-size: 13px; color: var(--muted); font-style: italic; }
    .tz-badge {
      display: flex; align-items: center; gap: 8px; margin-top: 8px;
      background: var(--accent-light); border: 1.5px solid rgba(196,98,45,0.3);
      border-radius: 10px; padding: 9px 14px; font-size: 13px; color: var(--accent); font-weight: 600;
    }

    /* ── LEAD TIME MULTI-SELECT PILLS ── */
    .lead-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .lead-pill {
      padding: 9px 16px; border-radius: 24px; font-family: var(--font-body);
      font-size: 13px; font-weight: 500; cursor: pointer; border: 1.5px solid var(--border);
      background: var(--surface); color: var(--muted); transition: all 0.15s; user-select: none;
    }
    .lead-pill:active { transform: scale(0.93); }
    .lead-pill.active { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
    .lead-hint { font-size: 11px; color: var(--muted); margin-top: 8px; }

    /* ── SUBMIT ── */
    .submit-btn {
      width: 100%; background: var(--text); color: var(--bg); border: none;
      border-radius: 12px; padding: 16px; font-family: var(--font-body);
      font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; margin-top: 8px;
    }
    .submit-btn:active { opacity: 0.75; }

    /* ── DETAIL ── */
    .back-btn    { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; color: var(--accent); font-weight: 500; cursor: pointer; background: none; border: none; padding: 0; margin-bottom: 28px; }
    .detail-name { font-family: var(--font-display); font-size: 48px; font-style: italic; font-weight: 400; line-height: 1; margin-bottom: 6px; }
    .detail-date { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
    .countdown-box { background: var(--accent-light); border-radius: var(--radius); padding: 28px; text-align: center; margin-bottom: 16px; }
    .countdown-num { font-size: 68px; font-weight: 600; line-height: 1; color: var(--accent); }
    .countdown-lbl { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .info-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
    .info-row  { display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .info-row:last-child { border-bottom: none; }
    .info-key  { font-size: 13px; color: var(--muted); flex-shrink: 0; margin-right: 12px; padding-top: 2px; }
    .info-val  { font-size: 14px; font-weight: 500; text-align: right; }
    .reminder-tags { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
    .reminder-tag  { background: var(--accent-light); color: var(--accent); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .notify-box  { background: var(--surface); border-radius: var(--radius); padding: 16px 20px; box-shadow: var(--shadow); display: flex; align-items: flex-start; gap: 12px; margin-bottom: 24px; }
    .notify-icon { font-size: 18px; padding-top: 1px; }
    .notify-text { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .notify-text strong { color: var(--text); font-weight: 600; }
    .actions    { display: flex; gap: 12px; }
    .action-btn { flex: 1; padding: 14px; border-radius: 12px; font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s; }
    .action-btn:active { opacity: 0.75; }
    .action-btn.edit   { background: var(--text); color: var(--bg); }
    .action-btn.delete { background: #FFE8E8; color: #C0392B; }

    /* ── SETTINGS ── */
    .settings-note  { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.7; }
    .settings-note a { color: var(--accent); text-decoration: none; }
    .section-header  { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin: 28px 0 14px; }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--text); color: var(--bg); padding: 11px 20px; border-radius: 24px;
      font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.25s, transform 0.25s;
      pointer-events: none; z-index: 300; max-width: 90%;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── LOADER ── */
    .pulse-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 10px 0; }
    .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); display: inline-block; animation: blink 1s infinite; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,100%{opacity:0.25;transform:scale(0.8)} 50%{opacity:1;transform:scale(1)} }

    .fade-in { animation: fadeIn 0.3s ease both; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    .list-section-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; padding: 0 16px; margin: 20px 0 10px; }
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
// ─────────────────────────────────────────
//  DATA
// ─────────────────────────────────────────
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

const TIMEZONES = [
  { label:'India (IST, UTC+5:30)',      value:'Asia/Kolkata' },
  { label:'New York (ET)',              value:'America/New_York' },
  { label:'Chicago (CT)',               value:'America/Chicago' },
  { label:'Denver (MT)',                value:'America/Denver' },
  { label:'Los Angeles (PT)',           value:'America/Los_Angeles' },
  { label:'Honolulu (HST)',             value:'Pacific/Honolulu' },
  { label:'London (GMT/BST)',           value:'Europe/London' },
  { label:'Paris / Berlin (CET)',       value:'Europe/Paris' },
  { label:'Moscow (MSK)',               value:'Europe/Moscow' },
  { label:'Dubai (GST, UTC+4)',         value:'Asia/Dubai' },
  { label:'Pakistan (PKT, UTC+5)',      value:'Asia/Karachi' },
  { label:'Nepal (NPT, UTC+5:45)',      value:'Asia/Kathmandu' },
  { label:'Bangladesh (BST, UTC+6)',    value:'Asia/Dhaka' },
  { label:'Sri Lanka (SLST)',           value:'Asia/Colombo' },
  { label:'Singapore / KL (SGT)',       value:'Asia/Singapore' },
  { label:'Tokyo (JST, UTC+9)',         value:'Asia/Tokyo' },
  { label:'Shanghai / Beijing (CST)',   value:'Asia/Shanghai' },
  { label:'Sydney (AEST)',              value:'Australia/Sydney' },
  { label:'Auckland (NZST)',            value:'Pacific/Auckland' },
];

const LEAD_TIMES = [
  { label:'On the day',    value:'on_day', days:0 },
  { label:'1 day before',  value:'1_day',  days:1 },
  { label:'2 days before', value:'2_days', days:2 },
  { label:'1 week before', value:'1_week', days:7 },
];

// ─────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────
const S = {
  view:'home', birthdays:[], selectedId:null, editingId:null,
  apiKey:'', userTimezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
  // form ephemeral
  fTz:'', fTzQ:'', fLeads:['on_day'],
  // settings ephemeral
  sTz:'', sTzQ:'',
};

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem('bday_v2') || '{}');
    S.birthdays    = d.birthdays    || [];
    S.apiKey       = d.apiKey       || '';
    S.userTimezone = d.userTimezone || S.userTimezone;
  } catch(e) {}
}
function saveData() {
  try { localStorage.setItem('bday_v2', JSON.stringify({birthdays:S.birthdays, apiKey:S.apiKey, userTimezone:S.userTimezone})); } catch(e) {}
}

// ─────────────────────────────────────────
//  UTILS
// ─────────────────────────────────────────
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

function daysUntil(month, day, tz) {
  const fmt = new Intl.DateTimeFormat('en-US', {timeZone:tz, year:'numeric', month:'numeric', day:'numeric'});
  const p   = fmt.formatToParts(new Date());
  const g   = t => parseInt(p.find(x => x.type===t).value);
  const [tY,tM,tD] = [g('year'),g('month'),g('day')];
  let bY = tY;
  if (tM > month || (tM===month && tD > day)) bY++;
  return Math.round((Date.UTC(bY,month-1,day) - Date.UTC(tY,tM-1,tD)) / 86400000);
}

const fmtDate   = (m,d) => `${MONTHS[m-1]} ${d}`;
const tzLabel   = v => TIMEZONES.find(t=>t.value===v)?.label || v || '';
const leadLabel = v => LEAD_TIMES.find(l=>l.value===v)?.label || v;

function notifyDesc(b) {
  const leads = Array.isArray(b.leadTimes) ? b.leadTimes : [b.leadTime||'on_day'];
  const parts = leads.map(v => {
    const l = LEAD_TIMES.find(x=>x.value===v);
    return l?.days===0 ? 'on their birthday' : `${l?.days} day${l?.days>1?'s':''} before`;
  });
  return `Notification at <strong>${b.notifTime||'08:00'} your time</strong> — ${parts.join(', ')} (${tzLabel(b.timezone)}).`;
}

const sortB = list => [...list].sort((a,b) => daysUntil(a.month,a.day,a.timezone)-daysUntil(b.month,b.day,b.timezone));

// ─────────────────────────────────────────
//  TOAST
// ─────────────────────────────────────────
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 2800);
}

// ─────────────────────────────────────────
//  NAV
// ─────────────────────────────────────────
function go(view, extra={}) {
  S.view = view; Object.assign(S, extra);
  if (view === 'add') {
    const b = extra.editingId ? S.birthdays.find(x=>x.id===extra.editingId) : null;
    S.fTz    = b?.timezone || '';
    S.fTzQ   = b ? tzLabel(b.timezone) : '';
    S.fLeads = b ? (Array.isArray(b.leadTimes)?b.leadTimes:[b.leadTime||'on_day']) : ['on_day'];
  }
  if (view === 'settings') {
    S.sTz  = S.userTimezone;
    S.sTzQ = tzLabel(S.userTimezone);
  }
  render(); window.scrollTo(0,0);
}

// ─────────────────────────────────────────
//  TZ SEARCH COMPONENT (reusable)
// ─────────────────────────────────────────
function tzSearchHtml(opts) {
  // opts: { id, query, selected, onInput, onSelect, showBadge }
  const {id, query='', selected='', onInput, onSelect} = opts;
  const q = query.toLowerCase();
  const filtered = q ? TIMEZONES.filter(t=>t.label.toLowerCase().includes(q)||t.value.toLowerCase().includes(q)) : TIMEZONES;
  const items = filtered.length
    ? filtered.map(t=>`<div class="tz-item ${t.value===selected?'selected':''}" onclick="${onSelect}('${t.value}','${t.label.replace(/'/g,"\\'")}');">${t.label}</div>`).join('')
    : `<div class="tz-empty">No results — try "India", "New York", "Tokyo"…</div>`;
  const badge = selected ? `<div class="tz-badge">✓ &nbsp;${tzLabel(selected)}</div>` : '';
  return `<div class="tz-wrap" id="${id}-wrap">
    <div style="position:relative">
      <input class="tz-search-input" id="${id}-q" type="text" placeholder="Search — India, London, Tokyo…"
             value="${query}" oninput="${onInput}(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
      <span class="tz-search-icon">🔍</span>
    </div>
    <div class="tz-list" id="${id}-list">${items}</div>
    <input type="hidden" id="${id}" value="${selected}">
    ${badge}
  </div>`;
}

// Form timezone handlers
function fTzInput(val) {
  S.fTzQ = val; if (!val) S.fTz = '';
  const q = val.toLowerCase();
  const f = q ? TIMEZONES.filter(t=>t.label.toLowerCase().includes(q)||t.value.toLowerCase().includes(q)) : TIMEZONES;
  const list = document.getElementById('f-tz-list');
  if (list) list.innerHTML = f.length
    ? f.map(t=>`<div class="tz-item ${t.value===S.fTz?'selected':''}" onclick="fTzPick('${t.value}','${t.label.replace(/'/g,"\\'")}');">${t.label}</div>`).join('')
    : `<div class="tz-empty">No results</div>`;
}
function fTzPick(val, label) {
  S.fTz = val; S.fTzQ = label;
  const q = document.getElementById('f-tz-q'); if(q) q.value = label;
  const h = document.getElementById('f-tz');   if(h) h.value = val;
  const list = document.getElementById('f-tz-list');
  if (list) list.querySelectorAll('.tz-item').forEach(el => el.classList.toggle('selected', el.textContent.trim()===label));
  // update / insert badge
  const wrap = document.getElementById('f-tz-wrap');
  if (wrap) {
    let badge = wrap.querySelector('.tz-badge');
    if (!badge) { badge = document.createElement('div'); badge.className='tz-badge'; wrap.appendChild(badge); }
    badge.innerHTML = `✓ &nbsp;${tzLabel(val)}`;
  }
}

// Settings timezone handlers
function sTzInput(val) {
  S.sTzQ = val; if (!val) S.sTz = '';
  const q = val.toLowerCase();
  const f = q ? TIMEZONES.filter(t=>t.label.toLowerCase().includes(q)||t.value.toLowerCase().includes(q)) : TIMEZONES;
  const list = document.getElementById('s-tz-list');
  if (list) list.innerHTML = f.length
    ? f.map(t=>`<div class="tz-item ${t.value===S.sTz?'selected':''}" onclick="sTzPick('${t.value}','${t.label.replace(/'/g,"\\'")}');">${t.label}</div>`).join('')
    : `<div class="tz-empty">No results</div>`;
}
function sTzPick(val, label) {
  S.sTz = val; S.sTzQ = label;
  const q = document.getElementById('s-tz-q'); if(q) q.value = label;
  const h = document.getElementById('s-tz');   if(h) h.value = val;
  const list = document.getElementById('s-tz-list');
  if (list) list.querySelectorAll('.tz-item').forEach(el => el.classList.toggle('selected', el.textContent.trim()===label));
  const wrap = document.getElementById('s-tz-wrap');
  if (wrap) {
    let badge = wrap.querySelector('.tz-badge');
    if (!badge) { badge = document.createElement('div'); badge.className='tz-badge'; wrap.appendChild(badge); }
    badge.innerHTML = `✓ &nbsp;${tzLabel(val)}`;
  }
}

// ─────────────────────────────────────────
//  LEAD PILLS
// ─────────────────────────────────────────
function leadPillsHtml() {
  return `<div class="lead-pills" id="lead-pills">
    ${LEAD_TIMES.map(l=>`
      <div class="lead-pill ${S.fLeads.includes(l.value)?'active':''}" onclick="toggleLead('${l.value}')">
        ${l.label}
      </div>`).join('')}
  </div>
  <div class="lead-hint">Tap to select — choose as many as you like</div>`;
}
function toggleLead(val) {
  const i = S.fLeads.indexOf(val);
  if (i>=0) { if(S.fLeads.length===1){toast('Pick at least one'); return;} S.fLeads.splice(i,1); }
  else S.fLeads.push(val);
  const el = document.getElementById('lead-pills');
  if (el) el.outerHTML = leadPillsHtml().split('<div class="lead-hint">')[0] + (el.nextElementSibling?.outerHTML||'');
  // full re-render of just the pills group
  const group = document.querySelector('.lead-group');
  if (group) group.innerHTML = leadPillsHtml();
}

// ─────────────────────────────────────────
//  CLAUDE API
// ─────────────────────────────────────────
async function parseNLP(text) {
  if (!S.apiKey) { toast('Add your Hugging Face token in Settings first'); return null; }

  const prompt = `<s>[INST] You are a birthday reminder parser. Extract info from this sentence and return ONLY valid JSON, nothing else, no explanation.

JSON format: {"name":"string","month":<1-12>,"day":<1-31>,"timezone":"IANA timezone string or null","leadTimes":["on_day"]}

Timezone mappings:
india/IST/Indian timings → Asia/Kolkata
New York/ET/Eastern → America/New_York
LA/PT/California → America/Los_Angeles
London/UK/GMT → Europe/London
Dubai/UAE → Asia/Dubai
Pakistan → Asia/Karachi
Singapore → Asia/Singapore
Tokyo/Japan → Asia/Tokyo
Paris/Germany/CET/Europe → Europe/Paris
Sydney/Australia → Australia/Sydney

LeadTimes options (pick all mentioned, default ["on_day"]):
"on the day/same day" → on_day
"1 day before/day before" → 1_day
"2 days before" → 2_days
"week before/1 week before" → 1_week

Sentence: "${text}"

Return only JSON: [/INST]`;

  const res = await fetch('https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${S.apiKey}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ inputs: prompt, parameters: { max_new_tokens: 200, temperature: 0.1, return_full_text: false } }),
  });

  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    if (res.status === 503) throw new Error('Model is loading, please wait 20 seconds and try again');
    throw new Error(e.error || `HTTP ${res.status}`);
  }

  const data = await res.json();
  const raw  = Array.isArray(data) ? data[0]?.generated_text : data?.generated_text;
  if (!raw) throw new Error('Empty response from model');

  // Extract JSON from the response
  const match = raw.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('Could not find JSON in response');
  return JSON.parse(match[0]);
}

// ─────────────────────────────────────────
//  RENDER — NAV
// ─────────────────────────────────────────
function renderNav() {
  const tabs=[{id:'home',icon:'🎂',label:'Birthdays'},{id:'add',icon:'＋',label:'Add'},{id:'settings',icon:'◎',label:'Settings'}];
  return `<nav class="bottom-nav">${tabs.map(t=>`
    <button class="nav-btn ${S.view===t.id||(S.view==='detail'&&t.id==='home')?'active':''}" onclick="go('${t.id}',{editingId:null})">
      <span class="nav-icon">${t.icon}</span><span class="nav-label">${t.label}</span>
    </button>`).join('')}</nav>`;
}

// ─────────────────────────────────────────
//  RENDER — HOME
// ─────────────────────────────────────────
function renderHome() {
  const sorted = sortB(S.birthdays);
  const soon   = sorted.filter(b=>{const d=daysUntil(b.month,b.day,b.timezone);return d<=14&&d>0;});
  const rest   = sorted.filter(b=>{const d=daysUntil(b.month,b.day,b.timezone);return d>14||d===0;});

  const card = b => {
    const days=daysUntil(b.month,b.day,b.timezone), isT=days===0, isS=days<=14&&days>0;
    return `<div class="birthday-card ${isT?'today':isS?'soon':''} fade-in" onclick="go('detail',{selectedId:'${b.id}'})">
      <div>
        <div class="card-name">${b.name}</div>
        <div class="card-date">${fmtDate(b.month,b.day)}</div>
        <div class="card-tz">${tzLabel(b.timezone)}</div>
      </div>
      <div class="card-right">
        ${isT?'<span class="today-pill">🎉 Today!</span>':`<div class="days-num">${days}</div><div class="days-lbl">days away</div>`}
      </div>
    </div>`;
  };

  const listHtml = sorted.length===0
    ? `<div class="empty-state fade-in"><span class="empty-icon">🎂</span><div class="empty-title">No birthdays yet</div><div class="empty-sub">Tap + to add your first one<br>and never forget again.</div></div>`
    : `<div class="birthday-list">
        ${soon.length?`<div class="list-section-label">Coming up soon</div>${soon.map(card).join('')}`:''}
        ${rest.length?`${soon.length?'<div class="list-section-label" style="margin-top:24px">All birthdays</div>':''}${rest.map(card).join('')}`:''}
      </div>`;

  return `<div class="header fade-in"><div><div class="header-eyebrow">upcoming</div><div class="header-title">Birthdays</div></div><div class="header-count">${S.birthdays.length} saved</div></div>${listHtml}`;
}

// ─────────────────────────────────────────
//  RENDER — ADD / EDIT
// ─────────────────────────────────────────
function renderAdd() {
  const p = S.editingId ? S.birthdays.find(b=>b.id===S.editingId)||{} : {};
  const monOpts = MONTHS.map((m,i)=>`<option value="${i+1}" ${(i+1)===p.month?'selected':''}>${m}</option>`).join('');
  const dayOpts = Array.from({length:31},(_,i)=>`<option value="${i+1}" ${(i+1)===p.day?'selected':''}>${i+1}</option>`).join('');

  return `<div class="screen fade-in">
    <div class="screen-title">${S.editingId?'Edit Birthday':'Add Birthday'}</div>
    <div class="screen-sub">Type naturally — or fill the form below</div>

    <div class="nlp-box">
      <div class="nlp-label">✦ Say it naturally</div>
      <textarea class="nlp-input" id="nlp" rows="3" placeholder='e.g. "Remind me on Dec 2nd to wish Pooja, India timings, 1 day before and on the day"'></textarea>
      <button class="nlp-btn" id="nlp-btn" onclick="handleParse()">Parse with AI →</button>
      <div id="nlp-result"></div>
    </div>

    <div class="divider"><div class="divider-line"></div><div class="divider-text">or fill manually</div><div class="divider-line"></div></div>

    <div class="form-group">
      <label class="form-label">Name</label>
      <input class="form-input" id="f-name" type="text" placeholder="Pooja" value="${p.name||''}">
    </div>

    <div class="form-group">
      <label class="form-label">Birthday</label>
      <div class="form-row">
        <div class="sel-wrap"><select class="form-select" id="f-month">${monOpts}</select></div>
        <div class="sel-wrap"><select class="form-select" id="f-day">${dayOpts}</select></div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Their Timezone</label>
      ${tzSearchHtml({id:'f-tz', query:S.fTzQ, selected:S.fTz, onInput:'fTzInput', onSelect:'fTzPick'})}
    </div>

    <div class="form-group">
      <label class="form-label">Remind Me</label>
      <div class="lead-group">${leadPillsHtml()}</div>
    </div>

    <div class="form-group">
      <label class="form-label">Notification Time (your time)</label>
      <input class="form-input" id="f-time" type="time" value="${p.notifTime||'08:00'}">
    </div>

    <button class="submit-btn" onclick="handleSave()">${S.editingId?'Update Birthday':'Save Birthday'}</button>
  </div>`;
}

// ─────────────────────────────────────────
//  RENDER — DETAIL
// ─────────────────────────────────────────
function renderDetail() {
  const b = S.birthdays.find(x=>x.id===S.selectedId);
  if (!b) { go('home'); return ''; }
  const days  = daysUntil(b.month,b.day,b.timezone);
  const isT   = days===0;
  const leads = Array.isArray(b.leadTimes) ? b.leadTimes : [b.leadTime||'on_day'];

  return `<div class="screen fade-in">
    <button class="back-btn" onclick="go('home')">← Back</button>
    <div class="detail-name">${b.name}</div>
    <div class="detail-date">${fmtDate(b.month,b.day)} · ${tzLabel(b.timezone)}</div>

    <div class="countdown-box">
      ${isT
        ?`<div style="font-size:52px;margin-bottom:8px">🎉</div><div style="font-size:18px;font-weight:600;color:var(--accent)">Happy Birthday, ${b.name}!</div>`
        :`<div class="countdown-num">${days}</div><div class="countdown-lbl">days until their birthday</div>`}
    </div>

    <div class="info-card">
      <div class="info-row">
        <span class="info-key">Remind me</span>
        <div class="reminder-tags">${leads.map(v=>`<span class="reminder-tag">${leadLabel(v)}</span>`).join('')}</div>
      </div>
      <div class="info-row">
        <span class="info-key">At</span>
        <span class="info-val">${b.notifTime||'08:00'} your time</span>
      </div>
      <div class="info-row">
        <span class="info-key">Their timezone</span>
        <span class="info-val">${tzLabel(b.timezone)}</span>
      </div>
    </div>

    <div class="notify-box">
      <span class="notify-icon">🔔</span>
      <div class="notify-text">${notifyDesc(b)}</div>
    </div>

    <div class="actions">
      <button class="action-btn edit"   onclick="go('add',{editingId:'${b.id}'})">Edit</button>
      <button class="action-btn delete" onclick="handleDelete('${b.id}')">Delete</button>
    </div>
  </div>`;
}

// ─────────────────────────────────────────
//  RENDER — SETTINGS
// ─────────────────────────────────────────
function renderSettings() {
  return `<div class="screen fade-in">
    <div class="screen-title">Settings</div>
    <div class="screen-sub">Your preferences</div>

    <div class="form-group">
      <label class="form-label">Your Timezone</label>
      ${tzSearchHtml({id:'s-tz', query:S.sTzQ, selected:S.sTz, onInput:'sTzInput', onSelect:'sTzPick'})}
    </div>

    <div class="section-header">AI — Natural Language</div>

    <div class="form-group">
      <label class="form-label">Hugging Face Token</label>
      <input class="form-input" id="s-key" type="password" placeholder="hf_..." value="${S.apiKey}" style="font-family:monospace;font-size:13px">
      <div class="settings-note">Needed for the "Say it naturally" feature — it's free!<br>Get your token at <a href="https://huggingface.co/settings/tokens" target="_blank">huggingface.co/settings/tokens</a> → New Token → Read type.</div>
    </div>

    <button class="submit-btn" onclick="handleSaveSettings()">Save Settings</button>

    <div style="text-align:center;margin-top:48px">
      <div style="font-size:13px;color:var(--muted);font-family:var(--font-display);font-style:italic">Birthdays</div>
      <div style="font-size:11px;color:var(--muted);opacity:0.4;margin-top:4px">v2.0 · Personal</div>
    </div>
  </div>`;
}

// ─────────────────────────────────────────
//  RENDER MAIN
// ─────────────────────────────────────────
function render() {
  const views = {home:renderHome, add:renderAdd, detail:renderDetail, settings:renderSettings};
  document.getElementById('app').innerHTML = (views[S.view]||renderHome)() + renderNav();
  const nlp = document.getElementById('nlp');
  if (nlp) nlp.addEventListener('keydown', e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleParse();}});
}

// ─────────────────────────────────────────
//  HANDLERS
// ─────────────────────────────────────────
async function handleParse() {
  const text = document.getElementById('nlp')?.value?.trim();
  if (!text) { toast('Please type something first'); return; }
  const btn=document.getElementById('nlp-btn'), out=document.getElementById('nlp-result');
  btn.disabled=true; btn.textContent='Reading…';
  out.innerHTML=`<div class="pulse-row"><div class="dots"><span></span><span></span><span></span></div> Parsing…</div>`;

  try {
    const parsed = await parseNLP(text);
    if (!parsed?.name || !parsed?.month || !parsed?.day) {
      out.innerHTML=`<div class="parsed-err">Couldn't parse. Try: <em>"Dec 2nd to wish Pooja, India timezone, 1 day before and on the day"</em></div>`;
    } else {
      const leads = Array.isArray(parsed.leadTimes) ? parsed.leadTimes : ['on_day'];
      out.innerHTML=`<div class="parsed-ok"><strong>Got it!</strong> ${parsed.name} · ${fmtDate(parsed.month,parsed.day)} · ${tzLabel(parsed.timezone)||'—'} · ${leads.map(leadLabel).join(' + ')}</div>`;

      // fill name/date
      const set=(id,v)=>{const el=document.getElementById(id);if(el&&v!=null)el.value=v;};
      set('f-name', parsed.name); set('f-month', parsed.month); set('f-day', parsed.day);

      // fill tz search
      if (parsed.timezone) { S.fTz=parsed.timezone; S.fTzQ=tzLabel(parsed.timezone); fTzPick(parsed.timezone, tzLabel(parsed.timezone)); }

      // fill lead pills
      S.fLeads = leads;
      const lg = document.querySelector('.lead-group'); if(lg) lg.innerHTML=leadPillsHtml();
    }
  } catch(e) {
    out.innerHTML=`<div class="parsed-err">Error: ${e.message}</div>`;
  }
  btn.disabled=false; btn.textContent='Parse with AI →';
}

function handleSave() {
  const name     = document.getElementById('f-name')?.value?.trim();
  const month    = parseInt(document.getElementById('f-month')?.value);
  const day      = parseInt(document.getElementById('f-day')?.value);
  const timezone = S.fTz;
  const leadTimes= [...S.fLeads];
  const notifTime= document.getElementById('f-time')?.value||'08:00';

  if (!name)           { toast('Please enter a name'); return; }
  if (!timezone)       { toast('Search and select their timezone'); return; }
  if (!leadTimes.length){ toast('Select at least one reminder'); return; }

  const id = S.editingId;
  if (id) { S.birthdays=S.birthdays.map(b=>b.id===id?{...b,name,month,day,timezone,leadTimes,notifTime}:b); }
  else    { S.birthdays.push({id:uid(),createdAt:Date.now(),name,month,day,timezone,leadTimes,notifTime}); }
  saveData();
  toast(id?`Updated ${name} ✓`:`${name} added! 🎉`);
  go('home', {editingId:null});
}

function handleDelete(id) {
  const b=S.birthdays.find(x=>x.id===id);
  if (!b||!confirm(`Delete ${b.name}'s birthday?`)) return;
  S.birthdays=S.birthdays.filter(x=>x.id!==id); saveData();
  toast('Deleted'); go('home');
}

function handleSaveSettings() {
  const key = document.getElementById('s-key')?.value?.trim();
  const tz  = S.sTz;
  if (!tz) { toast('Please select your timezone'); return; }
  S.apiKey=key; S.userTimezone=tz; saveData();
  toast('Settings saved ✓');
}

// ─────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────
loadData(); render();
</script>
</body>
</html>
